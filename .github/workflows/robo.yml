name: Caçador de Cupons

on:
  schedule:
    # Roda a cada 20 min entre 07:00 e 22:59 (Horário de Brasília = 10:00 às 01:59 UTC)
    - cron: '*/20 10-23,0-1 * * *'
  workflow_dispatch:

concurrency:
  group: cacador-cupons-group
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  buscar-cupons:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Baixar código e histórico
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar bibliotecas
        run: pip install requests beautifulsoup4

      - name: Vasculhar Canais e Web
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python cupons.py

      - name: Salvar histórico de cupons
        run: |
          git config user.name "Bot de Cupons"
          git config user.email "bot@github.com"
          git add historico.txt || true
          git diff --staged --quiet || (git commit -m "Atualiza memória de cupons" && git push --force-with-lease origin HEAD:main)
